version: 2

project_name: baobar

before:
  hooks:
    - go mod tidy
    # Embeds the app icon and a VERSIONINFO block into the Windows exe. Without
    # this the binary has a blank generic icon in Explorer, the taskbar and the
    # SmartScreen dialog, and no publisher string anywhere — on a platform where
    # the icon is the entire state signal and the binary is unsigned, that is
    # the worst first impression of the three platforms.
    #
    # `go run <pkg>@version` deliberately keeps goversioninfo out of go.mod: it
    # is a build tool, not a library. `-platform-specific` writes one .syso per
    # architecture with the filename suffixes Go uses to constrain them to
    # Windows, and it ignores -o, so this has to run from the main package's own
    # directory — the only place Go will link them from.
    #
    # The `sh -c` wrapper is not decoration: before.hooks in GoReleaser OSS is a
    # list of strings, and the dir:/cmd: object form fails to parse with
    # "cannot unmarshal !!map into string".
    - >-
      sh -c "cd cmd/baobar && go run
      github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.7.0
      -platform-specific -icon ../../assets/icon/baobar.ico
      -ver-major {{ .Major }} -ver-minor {{ .Minor }} -ver-patch {{ .Patch }}
      ../../packaging/windows/versioninfo.json"

builds:
  # macOS is built natively with cgo, and the whole release therefore runs on a
  # macOS runner: fyne.io/systray's macOS backend is Objective-C
  # (systray_darwin.m), so building it with CGO_ENABLED=0 drops the platform
  # files and leaves undefined symbols. This is the same constraint that keeps
  # darwin out of the cross-build job in ci.yml.
  - id: darwin
    main: ./cmd/baobar
    binary: baobar
    goos: [darwin]
    goarch: [amd64, arm64]
    env:
      - CGO_ENABLED=1
      # GitHub's macOS runners are arm64. Targeting amd64 needs clang told
      # which slice to emit; without it cgo compiles host-native objects and
      # the link fails on an architecture mismatch.
      - >-
        {{- if eq .Arch "amd64" }}CC=clang -arch x86_64{{- end }}
    ldflags:
      - -s -w
    mod_timestamp: "{{ .CommitTimestamp }}"

  # Linux and Windows need no cgo, so they cross-compile from the same macOS
  # runner.
  - id: crossbuilt
    main: ./cmd/baobar
    binary: baobar
    goos: [linux, windows]
    goarch: [amd64, arm64]
    env:
      - CGO_ENABLED=0
    ldflags:
      # -H=windowsgui suppresses the console window that would otherwise flash
      # on launch. It is a Windows-only linker flag.
      - -s -w
      - '{{ if eq .Os "windows" }}-H=windowsgui{{ end }}'
    mod_timestamp: "{{ .CommitTimestamp }}"

# One download for both Mac architectures. replace: true drops the two
# single-arch macOS archives so the release does not offer three ways to
# install the same thing.
universal_binaries:
  - id: darwin
    ids: [darwin]
    replace: true

archives:
  - id: default
    ids: [darwin, crossbuilt]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- if eq .Os "darwin" }}macOS{{ else }}{{ .Os }}{{ end }}
      {{- if not (eq .Arch "all") }}_{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      # Apache-2.0 and the BSD licenses require their notices to travel with
      # binary redistributions, so this ships inside every archive rather than
      # only living in the repository.
      - THIRD_PARTY_LICENSES.md

# .deb/.rpm exist so that the desktop entry and the icon theme files land at
# their standard paths — a tarball cannot place them, which is why an extracted
# Baobar has no applications-menu entry and no icon. nFPM is part of GoReleaser
# OSS; it only ever packages the linux artifacts.
#
# This is the applications-menu entry. It is not the autostart entry, which the
# app writes at runtime into ~/.config/autostart/baobar.desktop pointing at
# whatever executable is actually running. Both carry Icon=baobar.
nfpms:
  - id: default
    ids: [crossbuilt]
    package_name: baobar
    vendor: BrutalSystems
    homepage: "https://github.com/BrutalSystems/baobar"
    maintainer: "BrutalSystems <noreply@brutalsystems.com>"
    description: "Menu bar / system tray indicator for OpenBao login state and token expiry"
    license: MIT
    formats: [deb, rpm]
    bindir: /usr/bin
    contents:
      - src: packaging/linux/baobar.desktop
        dst: /usr/share/applications/baobar.desktop
      - src: assets/icon/hicolor/512x512/apps/baobar.png
        dst: /usr/share/icons/hicolor/512x512/apps/baobar.png
      - src: assets/icon/hicolor/256x256/apps/baobar.png
        dst: /usr/share/icons/hicolor/256x256/apps/baobar.png
      - src: assets/icon/hicolor/128x128/apps/baobar.png
        dst: /usr/share/icons/hicolor/128x128/apps/baobar.png
      - src: assets/icon/hicolor/64x64/apps/baobar.png
        dst: /usr/share/icons/hicolor/64x64/apps/baobar.png
      - src: assets/icon/hicolor/48x48/apps/baobar.png
        dst: /usr/share/icons/hicolor/48x48/apps/baobar.png
      - src: assets/icon/hicolor/32x32/apps/baobar.png
        dst: /usr/share/icons/hicolor/32x32/apps/baobar.png
      - src: assets/icon/hicolor/16x16/apps/baobar.png
        dst: /usr/share/icons/hicolor/16x16/apps/baobar.png

checksum:
  name_template: "checksums.txt"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"

release:
  github:
    owner: BrutalSystems
    name: baobar
  draft: false
  prerelease: auto

# winget manifests. Unlike Chocolatey this pipe is pure Go and needs no
# external CLI, so it runs in the macOS release job alongside everything else.
#
# Publishing means opening a pull request against microsoft/winget-pkgs from a
# fork, which needs a token and a fork that does not exist yet — so uploading is
# gated the same way as the cask. Without the token the manifests are still
# generated into dist/ for inspection.
winget:
  - name: baobar
    publisher: BrutalSystems
    publisher_url: "https://github.com/BrutalSystems"
    homepage: "https://github.com/BrutalSystems/baobar"
    license: MIT
    license_url: "https://github.com/BrutalSystems/baobar/blob/main/LICENSE"
    copyright: "2026 BrutalSystems"
    short_description: "Menu bar / system tray indicator for OpenBao login state and token expiry"
    description: |
      Baobar shows whether you are signed in to OpenBao and how long your token
      has left. Logging back in opens your browser, not a terminal.
    ids: [default]
    skip_upload: '{{ not (isEnvSet "WINGET_TOKEN") }}'
    repository:
      owner: BrutalSystems
      name: winget-pkgs
      branch: "baobar-{{ .Version }}"
      token: "{{ .Env.WINGET_TOKEN }}"
      pull_request:
        enabled: true
        draft: false
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master
