name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # macOS, not Linux: the darwin build needs cgo because fyne.io/systray's
    # macOS backend is Objective-C, and a macOS runner is also the only place
    # codesign and notarytool exist. Linux and Windows cross-compile from here
    # with CGO_ENABLED=0, so one runner covers every target.
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # GoReleaser derives the changelog from history; a shallow clone
          # gives it nothing to diff against.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The release must not be the thing that discovers a broken build. CI
      # runs this on every push, but a tag can be pushed to a commit CI never
      # saw.
      - name: Test
        run: go test -race -count=1 ./...

      # Regenerated rather than trusted from the repository: a dependency bump
      # that lands without someone rerunning the script would otherwise ship
      # archives whose notices are missing a component.
      - name: Regenerate third-party licenses
        run: |
          go install github.com/google/go-licenses@latest
          # GOBIN wins when set; otherwise go install lands in GOPATH/bin.
          bin="$(go env GOBIN)"
          [ -n "$bin" ] || bin="$(go env GOPATH)/bin"
          echo "$bin" >>"$GITHUB_PATH"
      - name: Write THIRD_PARTY_LICENSES.md
        run: tools/gen-third-party-licenses.sh

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # A PAT that can push to a BrutalSystems fork of microsoft/winget-pkgs
          # and open a PR upstream. Absent, manifests are generated but not
          # submitted and the release still succeeds.
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}

      # macOS packaging happens here rather than inside GoReleaser because every
      # GoReleaser feature that would do it — app_bundles, dmg, the cask `app:`
      # stanza, native notarization — is Pro-only, and this project is on the
      # open-source edition.
      #
      # The payoff is that tools/macapp.sh is the same script a developer runs by
      # hand on a laptop. Every command below was executed and verified locally
      # before this step was written; CI is not where any of it is discovered.
      - name: Package, sign and notarize Baobar.app
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail

          # The keychain is thrown away with the runner, so its password is
          # generated here rather than being a secret someone has to rotate.
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo -n "$MACOS_SIGN_P12" | base64 --decode -o "$RUNNER_TEMP/sign.p12"
          security import "$RUNNER_TEMP/sign.p12" -P "$MACOS_SIGN_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          # Without this, codesign blocks on a GUI prompt that never arrives and
          # the job hangs until it times out.
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN"

          echo -n "$MACOS_NOTARY_KEY" | base64 --decode -o "$RUNNER_TEMP/AuthKey.p8"
          export APPLE_NOTARY_KEY_FILE="$RUNNER_TEMP/AuthKey.p8"

          VERSION="${GITHUB_REF_NAME#v}"
          BINARY="$(find dist -type f -name baobar -path '*darwin_all*' | head -1)"
          test -n "$BINARY" || { echo "no universal darwin binary in dist/" >&2; exit 1; }

          ./tools/macapp.sh bundle "$BINARY" "$VERSION" dist
          ./tools/macapp.sh sign dist/Baobar.app
          ./tools/macapp.sh notarize dist/Baobar.app "$VERSION" dist
          ./tools/macapp.sh verify dist/Baobar.app

      - name: Attach Baobar.app to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" dist/Baobar-*-macOS.zip --clobber

  # Chocolatey gets its own job because `choco` exists only on Windows, and the
  # release job above must be macOS (native cgo for systray, plus codesign).
  # Re-running GoReleaser here is not an option either: it would rebuild every
  # target, and the darwin build cannot be produced on a Windows runner.
  #
  # So this consumes the published artifacts rather than rebuilding them, which
  # also means the package points at exactly the archive users download.
  chocolatey:
    needs: release
    runs-on: windows-latest
    # Job-level so the push step's `if:` can see it. A step-scoped env is not
    # visible to that step's own condition, which would silently never push.
    env:
      CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >>"$GITHUB_ENV"

      - name: Fetch the published checksum
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --pattern checksums.txt --output checksums.txt
          archive="baobar_${VERSION}_windows_amd64.zip"
          sum=$(grep " ${archive}\$" checksums.txt | awk '{print $1}')
          if [ -z "$sum" ]; then
            echo "no checksum for $archive in checksums.txt" >&2
            cat checksums.txt >&2
            exit 1
          fi
          echo "CHECKSUM64=$sum" >>"$GITHUB_ENV"

      - name: Stamp the install script
        shell: bash
        run: |
          sed -i "s|__CHECKSUM64__|${CHECKSUM64}|" packaging/chocolatey/tools/chocolateyinstall.ps1
          if grep -q "__CHECKSUM64__" packaging/chocolatey/tools/chocolateyinstall.ps1; then
            echo "placeholder was not substituted" >&2
            exit 1
          fi

      - name: choco pack
        shell: pwsh
        run: choco pack packaging/chocolatey/baobar.nuspec --version "$env:VERSION" --out packaging/chocolatey

      # Absent an API key the package is built and attached to the run as an
      # artifact but not pushed, so a release still succeeds before the
      # Chocolatey account exists — the same shape as the cask and notarization.
      #
      # A 403 here is usually NOT a broken key. Chocolatey refuses a new
      # submission while an earlier version from the same maintainer is still
      # in moderation, so every release cut before the queue clears will fail
      # this step. That is left failing rather than swallowed: the push really
      # did not happen, and a green tick would say otherwise. The GitHub
      # release, the cask and notarization are a separate job and unaffected.
      - name: choco push
        if: ${{ env.CHOCOLATEY_API_KEY != '' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          choco push "packaging/chocolatey/baobar.$env:VERSION.nupkg" `
            --source https://push.chocolatey.org/ --api-key $env:CHOCOLATEY_API_KEY
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::choco push failed. If this is a 403, check whether an earlier version is still awaiting moderation at https://community.chocolatey.org/packages/baobar — Chocolatey rejects a new submission while one is pending. The .nupkg is attached to this run as an artifact."
            exit $LASTEXITCODE
          }

      # always(): the package is worth having even when the push is refused —
      # it is the thing you inspect to work out why.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: chocolatey-package
          path: packaging/chocolatey/*.nupkg
